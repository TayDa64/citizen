name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          check-latest: true

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test --if-present

  # Local-socket Postgres only — matches test/api/throwaway-db.js (no TCP / DATABASE_URL).
  test-api:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          check-latest: true

      - name: Install Postgres + pgvector
        run: |
          set -eux
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            postgresql postgresql-contrib build-essential git
          PGVER=$(pg_lsclusters | awk 'NR>1 { print $1; exit }')
          test -n "$PGVER"
          sudo pg_ctlcluster "$PGVER" main start
          if ! sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "postgresql-${PGVER}-pgvector"; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "postgresql-server-dev-${PGVER}"
            git clone --branch v0.8.0 --depth 1 https://github.com/pgvector/pgvector.git /tmp/pgvector
            make -C /tmp/pgvector
            sudo make -C /tmp/pgvector install
          fi
          sudo -u postgres createuser -s "$USER" || true
          sudo -u postgres psql -d postgres -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Install
        run: npm ci

      - name: API tests
        run: npm run test:api
